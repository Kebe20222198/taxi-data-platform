name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Code Quality, Linting & Formatting (Ruff)
  # ============================================================================
  lint:
    name: 🧹 Lint & Format Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install --upgrade ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

  # ============================================================================
  # Stage 2: Unit Testing & Transformation Code Coverage (Pytest >= 70%)
  # ============================================================================
  unit-tests:
    name: 🧪 Unit Tests & Coverage (PySpark >= 70%)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Required by Apache Spark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest with Strict Coverage Gate (>= 70%)
        run: |
          python -m pytest \
            --cov=spark_jobs.common.transformations \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            tests/unit/ -v --tb=short

  # ============================================================================
  # Stage 3: dbt Analytics Build & Data Quality Tests (DuckDB Ephemeral Engine)
  # ============================================================================
  dbt-build:
    name: 🏗️ dbt Build & Quality Tests (DuckDB Engine)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DBT_TARGET: duckdb
      CI_DBT: "true"
      DUCKDB_PATH: tests/ci/ci_warehouse.duckdb
      DBT_SCHEMA: main
      DBT_THREADS: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt & DuckDB Adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb duckdb

      - name: Generate Synthetic CI Micro-Dataset
        run: |
          python tests/ci/generate_ci_sample_data.py

      - name: Execute dbt Build (Models + 45+ Quality Tests)
        run: |
          dbt build \
            --project-dir dbt \
            --profiles-dir dbt \
            --vars '{"month": "2025-01"}'
