# ==============================================================================
# NYC Taxi Data Platform — dbt Project Configuration
# ==============================================================================

name: 'taxi_platform'
version: '1.0.0'
config-version: 2

# Profile used to connect (configured in profiles.yml)
profile: 'taxi_platform'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Global Variables
vars:
  # Monthly partition target (format: YYYY-MM, can be overridden via CLI --vars '{"month": "2025-01"}')
  month: null
  # Date dimension boundaries for generation (365 days of 2025)
  dim_date_start: '2025-01-01'
  dim_date_end: '2025-12-31'
  # Quality threshold
  max_quarantine_rejection_rate: 0.20

# Models Materialization Hierarchy (Kimball Medallion)
models:
  taxi_platform:
    # ── Staging Layer: Views on top of Silver Delta / Reference data ──────────
    staging:
      +materialized: view
      +schema: staging

    # ── Marts Layer: Dimensional Star Schema & Aggregates ────────────────────
    marts:
      +schema: marts
      # Dimensions: static or slowly changing lookup tables
      dim_date:
        +materialized: table
      dim_zone:
        +materialized: table
      dim_payment_type:
        +materialized: table
      # Fact table: monthly idempotent incremental load
      fct_trips:
        +materialized: incremental
        +incremental_strategy: delete+insert
        +unique_key: trip_id
      # Pre-aggregated data marts & quality monitoring
      agg_zone_hourly:
        +materialized: table
      quarantine_summary:
        +materialized: view
