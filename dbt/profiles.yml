# ==============================================================================
# NYC Taxi Data Platform — dbt Profiles Configuration
# Supports both DuckDB (MinIO Delta Lake direct scan) and PostgreSQL (DWH)
# Exclusively configured via environment variables (zero hardcoded secrets)
# ==============================================================================

taxi_platform:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    # ── 1. PostgreSQL DWH Target (Default backend for Metabase & Observability) ──
    postgres:
      type: postgres
      host: "{{ env_var('DWH_POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('DWH_POSTGRES_USER', 'airflow') }}"
      password: "{{ env_var('DWH_POSTGRES_PASSWORD', 'airflow') }}"
      port: "{{ env_var('DWH_POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('DWH_POSTGRES_DB', 'airflow') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      keepalives_idle: 250
      connect_timeout: 10
      search_path: "{{ env_var('DBT_SCHEMA', 'public') }}"

    # ── 2. DuckDB Target (High-performance in-process query engine for MinIO S3) ─
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/data/taxi_warehouse.duckdb') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      extensions:
        - httpfs
        - delta
        - parquet
      secrets:
        - type: s3
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'minioadmin') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'minioadmin') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT', env_var('MINIO_ENDPOINT_URL', 'minio:9000')) | replace('http://', '') | replace('https://', '') }}"
          use_ssl: false
          url_style: path
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', env_var('MINIO_ENDPOINT_URL', 'minio:9000')) | replace('http://', '') | replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'minioadmin') }}"
        s3_use_ssl: "{{ env_var('MINIO_USE_SSL', 'false') }}"
        s3_url_style: "path"

